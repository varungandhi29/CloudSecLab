services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: cloudseclab-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cloudseclab-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cloudseclab-redis
          property: connectionString
      - key: LOCALSTACK_ENDPOINT
        value: http://cloudseclab-localstack:4566
      - key: FRONTEND_URL
        value: https://cloudseclab.onrender.com
      - key: SEED_DEMO_DATA
        value: "false"

  # 2. React / Vite Frontend Static Site
  - type: web
    name: cloudseclab-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cloudseclab-backend
          envVarKey: RENDER_EXTERNAL_URL

  # 3. LocalStack AWS Emulation Private Service
  - type: pserv
    name: cloudseclab-localstack
    runtime: docker
    dockerfilePath: ./deploy/localstack.Dockerfile
    plan: standard
    envVars:
      - key: SERVICES
        value: iam,s3,sts,secretsmanager,cloudtrail,lambda,kms,dynamodb
      - key: AWS_DEFAULT_REGION
        value: us-east-1

  # 4. Redis Key-Value Store
  - type: redis
    name: cloudseclab-redis
    plan: free
    ipAllowList: [] # Internal only

databases:
  # 5. Managed PostgreSQL Database
  - name: cloudseclab-db
    databaseName: cloudseclab
    user: cloudseclab
    plan: free
    ipAllowList: [] # Internal only

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cloudseclab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudseclab}
      POSTGRES_USER: ${POSTGRES_USER:-cloudseclab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudsec_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudseclab}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: cloudseclab-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.0
    container_name: cloudseclab-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=iam,s3,sts,secretsmanager,cloudtrail,lambda,kms,dynamodb
      - AWS_DEFAULT_REGION=us-east-1
      - PERSISTENCE=1
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudseclab-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cloudseclab}:${POSTGRES_PASSWORD:-cloudsec_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-cloudseclab}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      - ./content:/app/content:ro
      - cert_data:/app/output/certificates

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudseclab-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  localstack_data:
  cert_data:
